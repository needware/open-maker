<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="make">
  <title>make</title>
  <!-- macOS-style rounded square plate (rx 22% of edge) so the icon
       reads as a real product app icon at all sizes  Dock, taskbar,
       chrome topbar, PWA install. Ink near-black holds contrast on
       any UI surface, light or dark. -->
  <rect width="64" height="64" rx="14" fill="#1a1916"/>
  <!-- + mark, the brand's load-bearing symbol. Cream vertical
       backbone + warm-rust horizontal accent. The intersection reads
       as "where things compose". Bars sized for legibility down to
       16 px favicon. -->
  <rect x="26" y="6" width="12" height="52" rx="1.6" fill="#fbeee5"/>
  <rect x="6" y="26" width="52" height="12" rx="1.6" fill="#c96442"/>
</svg>
